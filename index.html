<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0 0 32px;
    text-transform: uppercase;
  }
  button {
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    background: #1a1a1a;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0 16px;
  }
  button:hover { background: #333; }
  button:active { background: #000; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #recordBtn {
    width: 100%;
    height: 64px;
  }
  #recordBtn.recording {
    background: #fff;
    color: #d43b3b;
    border-color: #d43b3b;
  }
  #recordBtn.recording:hover { background: #fdf1f1; }

  #timer {
    margin: 24px 0 8px;
    font-size: 2.4rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  #status {
    font-size: 0.85rem;
    color: #666;
    min-height: 1.2em;
  }
  #status.error { color: #d43b3b; }

  #reviewPanel {
    display: none;
    margin-top: 24px;
    text-align: left;
  }
  #reviewPanel.visible { display: block; }
  audio {
    width: 100%;
    margin-bottom: 16px;
  }
  .review-actions {
    display: flex;
    gap: 10px;
  }
  .review-actions button {
    flex: 1;
    height: 46px;
  }
  #downloadBtn {
    background: #1a7a3d;
    border-color: #1a7a3d;
  }
  #downloadBtn:hover { background: #145c2e; }
  #discardBtn {
    background: #fff;
    color: #1a1a1a;
    border-color: #ccc;
  }
  #discardBtn:hover { background: #f2f2f2; }
</style>
</head>
<body>

<div class="card">
  <h1>Voice Recorder</h1>

  <button id="recordBtn">Record</button>
  <div id="timer">00:00.0</div>
  <div id="status">Press Record, speak, press Stop, then review before downloading.</div>

  <div id="reviewPanel">
    <audio id="player" controls></audio>
    <div class="review-actions">
      <button id="downloadBtn">Download MP3</button>
      <button id="discardBtn">Discard</button>
    </div>
  </div>
</div>

<script>
(function(){
  const recordBtn = document.getElementById('recordBtn');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const reviewPanel = document.getElementById('reviewPanel');
  const player = document.getElementById('player');
  const downloadBtn = document.getElementById('downloadBtn');
  const discardBtn = document.getElementById('discardBtn');

  let audioCtx = null;
  let mediaStream = null;      // requested once, reused for every recording
  let sourceNode = null;
  let processorNode = null;
  let leftChunks = [];
  let sampleRate = 44100;
  let recording = false;
  let startTime = 0;
  let timerInterval = null;
  let currentBlob = null;
  let currentBlobUrl = null;

  function setStatus(msg, isError){
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }

  function fmtTime(ms){
    const totalSec = ms / 1000;
    const m = Math.floor(totalSec / 60).toString().padStart(2,'0');
    const s = Math.floor(totalSec % 60).toString().padStart(2,'0');
    const t = Math.floor((totalSec % 1) * 10);
    return m + ':' + s + '.' + t;
  }

  function updateTimer(){
    timerEl.textContent = fmtTime(performance.now() - startTime);
  }

  async function ensureMicAccess(){
    if (mediaStream && mediaStream.getAudioTracks().some(t => t.readyState === 'live')) {
      return true;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      sampleRate = audioCtx.sampleRate;
      return true;
    } catch(err){
      setStatus('Microphone access denied or unavailable.', true);
      return false;
    }
  }

  async function startRecording(){
    hideReview();
    const ok = await ensureMicAccess();
    if (!ok) return;

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    const bufferSize = 4096;
    processorNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
    leftChunks = [];

    processorNode.onaudioprocess = function(e){
      const input = e.inputBuffer.getChannelData(0);
      leftChunks.push(new Float32Array(input));
    };

    sourceNode.connect(processorNode);
    processorNode.connect(audioCtx.destination);

    recording = true;
    startTime = performance.now();
    timerEl.textContent = '00:00.0';
    timerInterval = setInterval(updateTimer, 50);

    recordBtn.textContent = 'Stop';
    recordBtn.classList.add('recording');
    setStatus('Recording. Press Stop to finish.');
  }

  function floatTo16BitPCM(input){
    const output = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++){
      let s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return output;
  }

  function mergeBuffers(chunks){
    let totalLength = 0;
    chunks.forEach(c => totalLength += c.length);
    const result = new Float32Array(totalLength);
    let offset = 0;
    chunks.forEach(c => { result.set(c, offset); offset += c.length; });
    return result;
  }

  function encodeMP3(samplesInt16, sr){
    const mp3encoder = new lamejs.Mp3Encoder(1, sr, 128);
    const mp3Data = [];
    const blockSize = 1152;
    for (let i = 0; i < samplesInt16.length; i += blockSize){
      const chunk = samplesInt16.subarray(i, i + blockSize);
      const mp3buf = mp3encoder.encodeBuffer(chunk);
      if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
    }
    const end = mp3encoder.flush();
    if (end.length > 0) mp3Data.push(new Int8Array(end));
    return new Blob(mp3Data, { type: 'audio/mp3' });
  }

  function hideReview(){
    reviewPanel.classList.remove('visible');
    if (currentBlobUrl){
      URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = null;
    }
    currentBlob = null;
    player.src = '';
  }

  function showReview(blob){
    currentBlob = blob;
    currentBlobUrl = URL.createObjectURL(blob);
    player.src = currentBlobUrl;
    reviewPanel.classList.add('visible');
  }

  function stopRecording(){
    recording = false;
    clearInterval(timerInterval);

    try{
      processorNode.disconnect();
      sourceNode.disconnect();
    }catch(e){}

    // Note: mic stream tracks are NOT stopped here, so permission
    // stays granted and no repeat browser prompt is needed next time.

    recordBtn.textContent = 'Record';
    recordBtn.classList.remove('recording');

    const merged = mergeBuffers(leftChunks);
    if (merged.length === 0){
      setStatus('No audio captured. Try again.', true);
      return;
    }

    setStatus('Encoding MP3...');
    setTimeout(() => {
      const samples16 = floatTo16BitPCM(merged);
      const blob = encodeMP3(samples16, sampleRate);
      showReview(blob);
      timerEl.textContent = '00:00.0';
      setStatus('Recording ready. Listen, then download or discard.');
    }, 30);
  }

  recordBtn.addEventListener('click', () => {
    if (!recording){
      startRecording();
    } else {
      stopRecording();
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!currentBlob) return;
    const url = currentBlobUrl;
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    a.href = url;
    a.download = 'recording-' + stamp + '.mp3';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus('Downloaded.');
  });

  discardBtn.addEventListener('click', () => {
    hideReview();
    setStatus('Discarded. Press Record to start a new one.');
  });
})();
</script>
</body>
</html>
