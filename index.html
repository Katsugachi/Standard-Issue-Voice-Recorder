<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 0 16px;
    border-bottom: 1px solid #e5e5e5;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #767676;
  }
  .timer-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0 4px;
  }
  #timer {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 48px;
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #recDot {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #c00;
    letter-spacing: 0.06em;
  }
  #recDot::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c00;
  }
  #recDot.on { display: inline-flex; }
  #recDot.on::before { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  #status {
    font-size: 14px;
    color: #767676;
    margin: 8px 0 24px;
    min-height: 20px;
  }
  #status.error { color: #c00; }

  #recordBtn {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 550;
    cursor: pointer;
  }
  #recordBtn:hover { background: #000; }
  #recordBtn:active { background: #333; }
  #recordBtn.recording { background: #c00; }
  #recordBtn.recording:hover { background: #a00; }
  #recordBtn:disabled { background: #e5e5e5; color: #999; cursor: default; }

  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
  }
  .hint kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    border: 1px solid #e5e5e5;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    background: #f7f7f7;
  }

  .meter {
    height: 3px;
    background: #eee;
    border-radius: 2px;
    margin-top: 24px;
    overflow: hidden;
  }
  #meterFill {
    height: 100%;
    width: 0%;
    background: #111;
  }

  h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #767676;
    margin: 40px 0 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #e5e5e5;
  }
  #empty {
    font-size: 14px;
    color: #999;
    padding: 16px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .rec {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .rec audio { display: none; }
  .rec-info { flex: 1; min-width: 0; }
  .rec-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rec-sub {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #767676;
    margin-top: 2px;
  }
  .rec button, .rec a {
    font-size: 13px;
    font-weight: 550;
    border: 1px solid #ddd;
    background: #fff;
    color: #111;
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .rec button:hover, .rec a:hover { border-color: #111; }
  .rec button.playing { background: #111; color: #fff; border-color: #111; }

  .foot {
    margin-top: 32px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Voice Recorder</h1>
    <span class="meta">MP3 · 128k · mono</span>
  </header>

  <div class="timer-row">
    <div id="timer">00:00</div>
    <span id="recDot">REC</span>
  </div>
  <div id="status">Ready.</div>

  <button id="recordBtn">Record</button>

  <div class="meter"><div id="meterFill"></div></div>

  <h2>Recordings</h2>
  <div id="empty">No recordings yet.</div>
  <div id="list"></div>

</div>

<script>
(function(){
  "use strict";
  var btn = document.getElementById('recordBtn');
  var timerEl = document.getElementById('timer');
  var statusEl = document.getElementById('status');
  var recDot = document.getElementById('recDot');
  var meterFill = document.getElementById('meterFill');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');

  var audioCtx = null, stream = null, source = null, processor = null, analyser = null, freqData = null;
  var chunks = [], sampleRate = 44100, recording = false;
  var startTime = 0, timerInt = null, rafId = null, count = 0;
  var currentAudio = null, currentPlayBtn = null;

  function setStatus(msg, err){
    statusEl.textContent = msg;
    statusEl.className = err ? 'error' : '';
  }
  function fmt(ms){
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }
  function fmtSize(b){
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function tick(){ timerEl.textContent = fmt(performance.now() - startTime); }

  function meter(){
    if (!analyser) return;
    analyser.getByteTimeDomainData(freqData);
    var sum = 0;
    for (var i = 0; i < freqData.length; i += 4){
      var v = (freqData[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / (freqData.length / 4));
    meterFill.style.width = Math.min(100, rms * 320) + '%';
    rafId = requestAnimationFrame(meter);
  }

  function start(){
    if (typeof lamejs === 'undefined'){ setStatus('Encoder failed to load. Check connection and reload.', true); return; }
    btn.disabled = true;
    setStatus('Requesting microphone…');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s){
      stream = s;
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sampleRate = audioCtx.sampleRate;
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      freqData = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      chunks = [];
      processor.onaudioprocess = function(e){ chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
      source.connect(processor);
      processor.connect(audioCtx.destination);

      recording = true;
      startTime = performance.now();
      timerInt = setInterval(tick, 250);
      tick();
      meter();
      btn.disabled = false;
      btn.textContent = 'Stop';
      btn.classList.add('recording');
      recDot.classList.add('on');
      setStatus('Recording…');
    }).catch(function(){
      btn.disabled = false;
      setStatus('Microphone blocked. Allow access and try again.', true);
    });
  }

  function floatTo16(input){
    var out = new Int16Array(input.length);
    for (var i = 0; i < input.length; i++){
      var v = input[i] < -1 ? -1 : (input[i] > 1 ? 1 : input[i]);
      out[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
    }
    return out;
  }

  function stop(){
    recording = false;
    clearInterval(timerInt);
    cancelAnimationFrame(rafId);
    meterFill.style.width = '0%';
    btn.disabled = true;
    btn.textContent = '…';
    btn.classList.remove('recording');
    recDot.classList.remove('on');

    try { processor.disconnect(); source.disconnect(); analyser.disconnect(); } catch(e){}
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });

    var total = 0, i;
    for (i = 0; i < chunks.length; i++) total += chunks.length === 0 ? 0 : chunks[i].length;
    if (total === 0){
      reset();
      setStatus('Nothing captured.', true);
      return;
    }
    var merged = new Float32Array(total), off = 0;
    for (i = 0; i < chunks.length; i++){ merged.set(chunks[i], off); off += chunks[i].length; }
    var durationMs = performance.now() - startTime;
    setStatus('Encoding…');

    setTimeout(function(){
      var pcm16 = floatTo16(merged);
      var enc = new lamejs.Mp3Encoder(1, sampleRate, 128);
      var data = [], bs = 1152, mp3buf;
      for (i = 0; i < pcm16.length; i += bs){
        mp3buf = enc.encodeBuffer(pcm16.subarray(i, i + bs));
        if (mp3buf.length > 0) data.push(new Int8Array(mp3buf));
      }
      mp3buf = enc.flush();
      if (mp3buf.length > 0) data.push(new Int8Array(mp3buf));
      var blob = new Blob(data, { type: 'audio/mpeg' });
      if (audioCtx) audioCtx.close();

      count++;
      var d = new Date();
      function p(n){ return (n < 10 ? '0' + n : n); }
      var name = 'rec-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.mp3';

      // instant download
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();

      addRow(name, url, blob.size, durationMs);
      reset();
      setStatus('Saved ' + name + '.');
    }, 20);
  }

  function reset(){
    timerEl.textContent = '00:00';
    btn.disabled = false;
    btn.textContent = 'Record';
    chunks = [];
  }

  function addRow(name, url, size, durMs){
    emptyEl.style.display = 'none';
    var row = document.createElement('div');
    row.className = 'rec';

    var audio = document.createElement('audio');
    audio.src = url;
    audio.preload = 'metadata';

    var info = document.createElement('div');
    info.className = 'rec-info';
    var n = document.createElement('div');
    n.className = 'rec-name'; n.textContent = name;
    var sub = document.createElement('div');
    sub.className = 'rec-sub'; sub.textContent = fmt(durMs) + ' · ' + fmtSize(size);
    info.appendChild(n); info.appendChild(sub);

    var play = document.createElement('button');
    play.textContent = 'Play';
    play.onclick = function(){
      if (currentAudio && currentAudio !== audio){ currentAudio.pause(); if (currentPlayBtn){ currentPlayBtn.textContent = 'Play'; currentPlayBtn.classList.remove('playing'); } }
      if (audio.paused){ audio.play(); play.textContent = 'Stop'; play.classList.add('playing'); currentAudio = audio; currentPlayBtn = play; }
      else { audio.pause(); audio.currentTime = 0; play.textContent = 'Play'; play.classList.remove('playing'); }
    };
    audio.onended = function(){ play.textContent = 'Play'; play.classList.remove('playing'); };

    var dl = document.createElement('a');
    dl.href = url; dl.download = name; dl.textContent = 'Download';

    row.appendChild(info); row.appendChild(play); row.appendChild(dl);
    listEl.insertBefore(row, listEl.firstChild);
  }

  btn.addEventListener('click', function(){ recording ? stop() : start(); });
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){
      e.preventDefault();
      btn.click();
    }
  });
})();
</script>
</body>
</html>
